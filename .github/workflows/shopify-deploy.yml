name: Deploy Casa Di Mor brand to Shopify

on:
  push:
    branches:
      - main
      - claude/cool-ramanujan-cRgPH
    paths:
      - 'shopify-theme/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_STORE: "8tqdhx-pb.myshopify.com"
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_API_BASE: "https://theme-kit-access.shopifyapps.com/cli/admin/api/2024-01"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find target (Atelier) theme
        id: theme
        run: |
          response=$(curl -s -H "X-Shopify-Access-Token: $SHOPIFY_ACCESS_TOKEN" -H "X-Shopify-Shop: $SHOPIFY_STORE" "$SHOPIFY_API_BASE/themes.json")
          echo "All themes:"
          echo "$response" | python3 -c "import sys, json; data = json.load(sys.stdin); [print(f\"  id={t['id']} name={t['name']!r} role={t['role']}\") for t in data.get('themes', [])]"
          theme_id=$(echo "$response" | python3 -c "import sys, json; data = json.load(sys.stdin); ids = [t['id'] for t in data.get('themes', []) if 'atelier' in t.get('name', '').lower()]; print(ids[0] if ids else '')")
          if [ -z "$theme_id" ]; then
            echo "Could not find Atelier theme. Response was:"
            echo "$response"
            exit 1
          fi
          echo "theme_id=$theme_id" >> "$GITHUB_OUTPUT"
          echo "Target theme ID: $theme_id"


      - name: Upload theme assets
        run: |
          theme_id="${{ steps.theme.outputs.theme_id }}"
          declare -A files=(
            ["shopify-theme/assets/casa-di-mor-brand.css"]="assets/casa-di-mor-brand.css"
            ["shopify-theme/assets/casa-di-mor-ds.css"]="assets/casa-di-mor-ds.css"
            ["shopify-theme/assets/cdm-editorial-sea-gown.jpg"]="assets/cdm-editorial-sea-gown.jpg"
            ["shopify-theme/assets/cdm-editorial-beach-group.jpg"]="assets/cdm-editorial-beach-group.jpg"
            ["shopify-theme/assets/cdm-lifestyle-garden.jpg"]="assets/cdm-lifestyle-garden.jpg"
            ["shopify-theme/assets/cdm-key-espresso.png"]="assets/cdm-key-espresso.png"
            ["shopify-theme/assets/cdm-look-white-dress.jpg"]="assets/cdm-look-white-dress.jpg"
            ["shopify-theme/assets/cdm-look-02.jpg"]="assets/cdm-look-02.jpg"
            ["shopify-theme/assets/cdm-look-03.jpg"]="assets/cdm-look-03.jpg"
            ["shopify-theme/assets/cdm-look-04.jpg"]="assets/cdm-look-04.jpg"
            ["shopify-theme/assets/casa-di-mor-footer.css"]="assets/casa-di-mor-footer.css"
            ["shopify-theme/assets/cdm-logo-full-ivory.png"]="assets/cdm-logo-full-ivory.png"
            ["shopify-theme/snippets/casa-di-mor-fonts.liquid"]="snippets/casa-di-mor-fonts.liquid"
            ["shopify-theme/snippets/cdm-jaguar-walk.liquid"]="snippets/cdm-jaguar-walk.liquid"
            ["shopify-theme/assets/cdm-jaguar-walk.gif"]="assets/cdm-jaguar-walk.gif"
            ["shopify-theme/assets/cdm-coastal-video.mov"]="assets/cdm-coastal-video.mov"
            ["shopify-theme/sections/casa-di-mor-ds.liquid"]="sections/casa-di-mor-ds.liquid"
            ["shopify-theme/sections/casa-di-mor-footer.liquid"]="sections/casa-di-mor-footer.liquid"
            ["shopify-theme/sections/casa-di-mor-brand-story.liquid"]="sections/casa-di-mor-brand-story.liquid"
            ["shopify-theme/templates/page.nuestra-historia.json"]="templates/page.nuestra-historia.json"
          )
          for src in "${!files[@]}"; do
            key="${files[$src]}"
            echo "Uploading $key"
            python3 -c "import json, base64, sys; key, src = sys.argv[1], sys.argv[2]; data = open(src, 'rb').read(); json.dump({'asset': {'key': key, 'attachment': base64.b64encode(data).decode()}}, open('/tmp/payload.json', 'w'))" "$key" "$src"
            http_code=$(curl -s -X PUT \
              -H "X-Shopify-Access-Token: $SHOPIFY_ACCESS_TOKEN" \
              -H "X-Shopify-Shop: $SHOPIFY_STORE" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/payload.json \
              "$SHOPIFY_API_BASE/themes/$theme_id/assets.json" -o /tmp/response.json -w "%{http_code}")
            echo "  -> $http_code"
            if [ "$http_code" != "200" ]; then
              echo "  Error response:"
              cat /tmp/response.json
              echo
            fi
          done

      - name: Remove obsolete theme assets
        run: |
          theme_id="${{ steps.theme.outputs.theme_id }}"
          obsolete=(
            "assets/cdm-isotype-jaguar-espresso.png"
            "assets/cdm-jaguar-walk.png"
          )
          for key in "${obsolete[@]}"; do
            echo "Deleting $key"
            http_code=$(curl -s --globoff -X DELETE \
              -H "X-Shopify-Access-Token: $SHOPIFY_ACCESS_TOKEN" \
              -H "X-Shopify-Shop: $SHOPIFY_STORE" \
              "$SHOPIFY_API_BASE/themes/$theme_id/assets.json?asset[key]=$key" -o /tmp/response.json -w "%{http_code}")
            echo "  -> $http_code"
            if [ "$http_code" != "200" ]; then
              echo "  Response:"
              cat /tmp/response.json
              echo
            fi
          done

      - name: Inject fonts snippet into theme.liquid
        run: |
          theme_id="${{ steps.theme.outputs.theme_id }}"
          response=$(curl -s --globoff -H "X-Shopify-Access-Token: $SHOPIFY_ACCESS_TOKEN" -H "X-Shopify-Shop: $SHOPIFY_STORE" "$SHOPIFY_API_BASE/themes/$theme_id/assets.json?asset[key]=layout/theme.liquid")

          current=$(echo "$response" | python3 -c "import sys, json; print(json.load(sys.stdin)['asset']['value'])")

          if echo "$current" | grep -q "casa-di-mor-fonts"; then
            echo "Snippet already referenced in theme.liquid, skipping injection."
            exit 0
          fi

          updated=$(echo "$current" | sed "s#</head>#{% render 'casa-di-mor-fonts' %}\n</head>#")

          payload=$(python3 -c "import sys, json; content = sys.stdin.read(); print(json.dumps({'asset': {'key': 'layout/theme.liquid', 'value': content}}))" <<< "$updated")

          curl -s -X PUT \
            -H "X-Shopify-Access-Token: $SHOPIFY_ACCESS_TOKEN" \
            -H "X-Shopify-Shop: $SHOPIFY_STORE" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$SHOPIFY_API_BASE/themes/$theme_id/assets.json"

      - name: Replace home page with single Verano Eterno section
        run: |
          theme_id="${{ steps.theme.outputs.theme_id }}"
          response=$(curl -s --globoff -H "X-Shopify-Access-Token: $SHOPIFY_ACCESS_TOKEN" -H "X-Shopify-Shop: $SHOPIFY_STORE" "$SHOPIFY_API_BASE/themes/$theme_id/assets.json?asset[key]=templates/index.json")

          current=$(echo "$response" | python3 -c "import sys, json; print(json.load(sys.stdin)['asset']['value'])")

          echo "Current templates/index.json:"
          echo "$current"

          cat > /tmp/merge_index.py << 'EOF'
          import json, sys
          data = json.loads(sys.stdin.read())
          key = 'casa_di_mor_ds'
          section = {'type': 'casa-di-mor-ds', 'settings': {}}
          data['sections'] = {key: section}
          data['order'] = [key]
          print(json.dumps(data))
          EOF

          updated=$(python3 /tmp/merge_index.py <<< "$current")

          payload=$(python3 -c "import sys, json; content = sys.stdin.read(); print(json.dumps({'asset': {'key': 'templates/index.json', 'value': content}}))" <<< "$updated")

          http_code=$(curl -s -X PUT \
            -H "X-Shopify-Access-Token: $SHOPIFY_ACCESS_TOKEN" \
            -H "X-Shopify-Shop: $SHOPIFY_STORE" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$SHOPIFY_API_BASE/themes/$theme_id/assets.json" -o /tmp/response.json -w "%{http_code}")
          echo "  -> $http_code"
          if [ "$http_code" != "200" ]; then
            echo "  Error response:"
            cat /tmp/response.json
            echo
          fi

      - name: Patch Design accordion heading and add size guide in product template
        run: |
          theme_id="${{ steps.theme.outputs.theme_id }}"
          response=$(curl -s --globoff \
            -H "X-Shopify-Access-Token: $SHOPIFY_ACCESS_TOKEN" \
            -H "X-Shopify-Shop: $SHOPIFY_STORE" \
            "$SHOPIFY_API_BASE/themes/$theme_id/assets.json?asset[key]=templates/product.json")
          cat > /tmp/patch_design.py << 'PYEOF'
import json, sys

d = json.load(sys.stdin)
content = d.get('asset', {}).get('value', '')
if not content:
    print('ERROR: no content', file=sys.stderr)
    sys.exit(1)
data = json.loads(content)

SIZE_GUIDE_HTML = """<div style="font-family:var(--font-body--family,'Jost',sans-serif);font-size:0.85rem;color:#42270f">
<table style="width:100%;border-collapse:collapse;text-align:center">
<thead>
<tr style="border-bottom:1px solid #c0ad99">
<th style="padding:6px 4px;font-weight:500;text-align:left">Talla</th>
<th style="padding:6px 4px;font-weight:500">Busto</th>
<th style="padding:6px 4px;font-weight:500">Cintura</th>
<th style="padding:6px 4px;font-weight:500">Cadera</th>
</tr>
</thead>
<tbody>
<tr><td style="padding:5px 4px;text-align:left">XS</td><td style="padding:5px 4px">92</td><td style="padding:5px 4px">68</td><td style="padding:5px 4px">96</td></tr>
<tr style="background:#f2ede6"><td style="padding:5px 4px;text-align:left">S</td><td style="padding:5px 4px">96</td><td style="padding:5px 4px">72</td><td style="padding:5px 4px">100</td></tr>
<tr><td style="padding:5px 4px;text-align:left">M</td><td style="padding:5px 4px">100</td><td style="padding:5px 4px">76</td><td style="padding:5px 4px">104</td></tr>
<tr style="background:#f2ede6"><td style="padding:5px 4px;text-align:left">L</td><td style="padding:5px 4px">104</td><td style="padding:5px 4px">80</td><td style="padding:5px 4px">108</td></tr>
<tr><td style="padding:5px 4px;text-align:left">XL</td><td style="padding:5px 4px">108</td><td style="padding:5px 4px">84</td><td style="padding:5px 4px">112</td></tr>
</tbody>
</table>
<p style="margin-top:8px;font-size:0.75rem;color:#74502e">Medidas en centímetros.</p>
</div>"""

def patch_blocks(blocks_dict):
    changed = 0
    for blk in blocks_dict.values():
        s = blk.get('settings', {})
        heading = s.get('heading', '')
        if isinstance(heading, str) and heading.strip().lower() in ('design', 'diseño', 'diseno'):
            s['heading'] = 'Guía de Tallas'
            s['content'] = SIZE_GUIDE_HTML
            changed += 1
        # recurse into nested blocks
        if 'blocks' in blk and isinstance(blk['blocks'], dict):
            changed += patch_blocks(blk['blocks'])
    return changed

total = 0
for section in data.get('sections', {}).values():
    if 'blocks' in section and isinstance(section['blocks'], dict):
        total += patch_blocks(section['blocks'])

print(f'Changed {total} accordion blocks', file=sys.stderr)
print(json.dumps(data))
PYEOF
          updated=$(echo "$response" | python3 /tmp/patch_design.py)
          if [ $? -ne 0 ]; then
            echo "Patch script failed"
            exit 0
          fi
          payload=$(python3 -c "import sys, json; content = sys.stdin.read(); print(json.dumps({'asset': {'key': 'templates/product.json', 'value': content}}))" <<< "$updated")
          http_code=$(curl -s -X PUT \
            -H "X-Shopify-Access-Token: $SHOPIFY_ACCESS_TOKEN" \
            -H "X-Shopify-Shop: $SHOPIFY_STORE" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$SHOPIFY_API_BASE/themes/$theme_id/assets.json" -o /tmp/response.json -w "%{http_code}")
          echo "  -> $http_code"
          if [ "$http_code" != "200" ]; then
            cat /tmp/response.json
          fi
        continue-on-error: true

      - name: Replace site footer with Casa Di Mor footer section
        run: |
          theme_id="${{ steps.theme.outputs.theme_id }}"
          response=$(curl -s --globoff -H "X-Shopify-Access-Token: $SHOPIFY_ACCESS_TOKEN" -H "X-Shopify-Shop: $SHOPIFY_STORE" "$SHOPIFY_API_BASE/themes/$theme_id/assets.json?asset[key]=sections/footer-group.json")

          current=$(echo "$response" | python3 -c "import sys, json; print(json.load(sys.stdin)['asset']['value'])")

          echo "Current footer-group.json:"
          echo "$current"

          cat > /tmp/merge_footer.py << 'EOF'
          import json, sys
          data = json.loads(sys.stdin.read())
          changed = []
          for key, section in data.get('sections', {}).items():
            if key == 'footer':
              section['type'] = 'casa-di-mor-footer'
              section['settings'] = {}
              section.pop('blocks', None)
              section.pop('block_order', None)
              changed.append(key)
          if 'logo_RVGHD7' in data.get('sections', {}):
            del data['sections']['logo_RVGHD7']
            changed.append('removed logo_RVGHD7')
          data['order'] = [k for k in data.get('order', []) if k != 'logo_RVGHD7']
          print(f"Changed sections: {changed}", file=sys.stderr)
          print(json.dumps(data))
          EOF

          updated=$(python3 /tmp/merge_footer.py <<< "$current")

          payload=$(python3 -c "import sys, json; content = sys.stdin.read(); print(json.dumps({'asset': {'key': 'sections/footer-group.json', 'value': content}}))" <<< "$updated")

          http_code=$(curl -s -X PUT \
            -H "X-Shopify-Access-Token: $SHOPIFY_ACCESS_TOKEN" \
            -H "X-Shopify-Shop: $SHOPIFY_STORE" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$SHOPIFY_API_BASE/themes/$theme_id/assets.json" -o /tmp/response.json -w "%{http_code}")
          echo "  -> $http_code"
          if [ "$http_code" != "200" ]; then
            echo "  Error response:"
            cat /tmp/response.json
            echo
          fi
